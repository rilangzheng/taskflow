spring.application.name=taskflow

spring.datasource.url=jdbc:mysql://localhost:3306/taskflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.web.error.include-message=always

mybatis.configuration.map-underscore-to-camel-case=true

spring.jackson.datatype.enum.fail-on-numbers-for-enums=true